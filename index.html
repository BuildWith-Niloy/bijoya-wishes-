
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8d9a9">
  <meta name="description" content="A little Shubho Bijoya wish, made with love.">
  <title>Shubho Bijoya 🌺</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="greeting-page">
    <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>

    <span class="corner-flower flower-one" aria-hidden="true">❀</span>
    <span class="corner-flower flower-two" aria-hidden="true">✿</span>
    <span class="corner-flower flower-three" aria-hidden="true">❀</span>

    <article class="wish-card">
      <div class="top-ornament" aria-hidden="true">
        <span>—</span>
        <span class="lotus">❀</span>
        <span>—</span>
      </div>

      <p class="eyebrow">A little wish, made just for you</p>

      <div class="typed-message" aria-label="Shubho Bijoya greeting">
        <p class="typed-line salutation">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>

        <p class="typed-line divider-line">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>

        <p class="typed-line blessing">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>

        <p class="typed-line blessing">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>

        <p class="typed-line signoff">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>

        <p class="typed-line signature">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>

        <p class="typed-line instagram-line">
          <span class="typed-text"></span><span class="cursor hidden"></span>
        </p>
      </div>
    </article>
  </main>
</body>
</html>
